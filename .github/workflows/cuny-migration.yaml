name: CUNY staged migration

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      terraform_cli_version:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  migration:
    runs-on: self-hosted
    environment: ${{ inputs.stage == 'prepare-apply' && 'alz-lab-apply' || 'alz-lab-plan' }}
    concurrency: lab-tfstate
    timeout-minutes: 30
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: true
      ARM_USE_OIDC: true
      TF_IN_AUTOMATION: true
    steps:
      - name: Check operation
        env:
          MIGRATION_STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          case "$MIGRATION_STAGE" in
            inventory|prepare-plan|prepare-apply) ;;
            *) echo "Unsupported migration stage: $MIGRATION_STAGE" >&2; exit 1 ;;
          esac
          umask 077
          MIGRATION_DIRECTORY="$RUNNER_TEMP/cuny-migration-$GITHUB_RUN_ID"
          mkdir -p "$MIGRATION_DIRECTORY"
          printf 'MIGRATION_DIRECTORY=%s\n' "$MIGRATION_DIRECTORY" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false
          terraform_version: ${{ inputs.terraform_cli_version }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure create-only preparation
        if: inputs.stage != 'inventory'
        shell: pwsh
        env:
          MIGRATION_STAGE: ${{ inputs.stage }}
        run: ./scripts/Invoke-CunyMigration.ps1 -Stage $env:MIGRATION_STAGE -ConfigureOnly

      - name: Initialize private backend
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.BACKEND_AZURE_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}" \
            -backend-config="key=terraform.tfstate"

      - name: Back up and inventory state privately
        env:
          STORAGE_ACCOUNT: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_NAME }}
          STORAGE_CONTAINER: ${{ vars.BACKEND_AZURE_STORAGE_ACCOUNT_CONTAINER_NAME }}
        run: |
          set -euo pipefail
          umask 077
          az storage blob snapshot --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$STORAGE_CONTAINER" \
            --name terraform.tfstate \
            --query '{snapshot:snapshot}' -o json
          terraform state pull > "$MIGRATION_DIRECTORY/platform.tfstate"

      - name: Report non-secret state inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $state = Get-Content "$env:MIGRATION_DIRECTORY/platform.tfstate" -Raw |
            ConvertFrom-Json -AsHashtable
          Write-Host "STATE $(@{
            serial = $state.serial
            lineage = $state.lineage
            terraform_version = $state.terraform_version
          } | ConvertTo-Json -Compress)"
          $counts = @{}
          foreach ($resource in $state.resources) {
            if ($resource.mode -ne 'managed') { continue }
            foreach ($instance in $resource.instances) {
              $address = (@(
                $resource.module, $resource.type, $resource.name
              ) | Where-Object { $_ }) -join '.'
              if ($instance.ContainsKey('index_key')) {
                $address += "[$($instance.index_key | ConvertTo-Json -Compress)]"
              }
              $attributes = $instance.attributes
              if ($resource.module -eq 'module.management_groups[0]') {
                $counts[$resource.name]++
                if ($resource.name.StartsWith('management_groups_level_')) {
                  Write-Host "GROUP $(@{
                    address = $address
                    id = $attributes.id
                    body = $attributes.body
                    replace_triggers = $attributes.replace_triggers_external_values
                  } | ConvertTo-Json -Compress -Depth 20)"
                }
              }
              if ($resource.name -eq 'policy_assignments') {
                $body = $attributes.body
                if ($body -is [hashtable] -and $body.ContainsKey('value')) {
                  $body = $body.value
                }
                if ($body -is [string]) { $body = $body | ConvertFrom-Json -AsHashtable }
                $scope = ($attributes.id -split '/providers/')[-2]
                $counts["assignment_scope:$scope"]++
                if ($body.properties.notScopes.Count -gt 0) {
                  Write-Host "EXCLUSIONS $(@{
                    address = $address
                    notScopes = $body.properties.notScopes
                  } | ConvertTo-Json -Compress)"
                }
              }
            }
          }
          Write-Host "COUNTS $($counts | ConvertTo-Json -Compress)"

      - name: Validate or apply create-only preparation
        if: inputs.stage != 'inventory'
        shell: pwsh
        env:
          MIGRATION_STAGE: ${{ inputs.stage }}
        run: ./scripts/Invoke-CunyMigration.ps1 -Stage $env:MIGRATION_STAGE

      - name: Remove private runner scratch state
        if: always()
        run: |
          if [[ -n "${MIGRATION_DIRECTORY:-}" ]]; then
            rm -f -- "$MIGRATION_DIRECTORY/platform.tfstate"
            rm -f -- "$MIGRATION_DIRECTORY/prepare.tfplan"
          fi
